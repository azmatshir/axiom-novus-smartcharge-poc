<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axiom Novus SmartCharge – POC</title><link rel="icon" href="https://axiomnovus.com/wp-content/uploads/2023/08/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#161C3B; --navy-2:#232A52; --indigo:#4F6CF5; --indigo-2:#6D84F7; --orange:#FF6000; --orange-ink:#C24A00;
  --mint:#96CCC2; --teal:#2F6B60; --bg:#E6E9F2; --card:#FFFFFF; --line:rgba(22,28,59,.08);
  --ink:#161C3B; --ink-2:rgba(22,28,59,.66); --ink-3:rgba(22,28,59,.45); --soft:rgba(22,28,59,.05);
  --shadow:0 18px 48px rgba(22,28,59,.08); --r-xl:30px; --r-lg:22px; --r-md:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Urbanist',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(1200px 600px at 85% -10%,rgba(79,108,245,.12),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(150,204,194,.25),transparent 60%);
  background-attachment:fixed;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;padding:24px}
.login-hero{border-radius:var(--r-xl);background:linear-gradient(180deg,rgba(22,28,59,.15),rgba(22,28,59,.85)),url('https://axiomnovus.com/wp-content/uploads/2023/08/istock-895028314-min-scaled.jpg') center/cover,var(--navy);
  color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:flex-end;min-height:560px}
.login-hero h1{font-size:56px;font-weight:400;line-height:1.05;letter-spacing:-1px}
.login-hero p{margin-top:16px;color:rgba(255,255,255,.82);max-width:460px;font-size:17px}
.login-card{align-self:center;justify-self:center;width:min(440px,100%);background:#fff;border-radius:var(--r-xl);padding:40px;box-shadow:var(--shadow)}
.login-card img{height:52px}
.login-card h2{font-size:28px;font-weight:600;margin:28px 0 6px}
.login-card .muted{margin-bottom:24px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:88px 1fr;gap:20px;padding:20px 24px 40px 12px;min-height:100vh}
.rail{position:sticky;top:96px;align-self:start;height:calc(100vh - 116px);min-height:520px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);border-radius:40px;
  display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;box-shadow:var(--shadow)}
.rail .brandmark{width:46px;height:46px;border-radius:14px;background:#fff;box-shadow:0 6px 16px rgba(22,149,124,.25);display:grid;place-items:center;margin-bottom:14px;color:#fff;font-weight:700}
.rail button{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);position:relative}
.rail button:hover{background:var(--soft);color:var(--ink)}
.rail button.active{background:var(--navy);color:#fff}
.rail .spacer{flex:1}
.rail button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:58px;background:var(--navy);color:#fff;font-size:12px;padding:6px 10px;border-radius:999px;white-space:nowrap;z-index:5}
.main{min-width:0}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;margin-left:12px;height:56px}
.logo{display:flex;align-items:center;gap:10px;min-width:250px}
.logo img{height:38px}
.logo span{color:var(--indigo);font-size:20px;font-weight:500;margin-top:6px}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:0 10px 0 18px;height:50px;box-shadow:var(--shadow);color:var(--ink-3)}
.search input{border:0;outline:0;flex:1;background:none;color:var(--ink)}
.kbd{font-size:12px;background:var(--soft);border-radius:8px;padding:4px 8px;color:var(--ink-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;height:46px;padding:0 16px;box-shadow:var(--shadow);font-weight:500}
.pill select{border:0;outline:0;background:none;font-weight:600;cursor:pointer}
.iconbtn{width:46px;height:46px;border-radius:999px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--orange);border:2px solid #fff}
.avatar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:4px 14px 4px 4px;box-shadow:var(--shadow);font-weight:600;position:relative}
.avatar .av{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px}
.menu{position:absolute;top:56px;right:0;background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(22,28,59,.18);padding:8px;min-width:220px;z-index:40}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;font-weight:500}
.menu a:hover,.menu button:hover{background:var(--soft)}
.menu .danger{color:var(--orange-ink)}
.menu h4{padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.notif{width:340px}
.notif .n{padding:10px 12px;border-radius:12px;display:flex;gap:10px}
.notif .n:hover{background:var(--soft)}
.notif .n small{display:block;color:var(--ink-3)}

/* toggle */
.toggle{width:46px;height:26px;border-radius:999px;background:rgba(22,28,59,.18);position:relative;transition:.2s;flex:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.toggle.on{background:var(--indigo)}
.toggle.on::after{left:23px}

/* ---------- generic ---------- */
.page{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:20px}
.g-dash{grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr)}
.card{background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:24px}
.card-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.card-h .ic{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center}
.card-h h3{font-size:19px;font-weight:600}
.card-h small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.muted{color:var(--ink-2)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-dark{background:var(--navy);color:#fff}
.btn-dark:hover{background:var(--navy-2)}
.btn-indigo{background:var(--indigo);color:#fff}
.btn-white{background:#fff;color:var(--navy)}
.btn-ghost{background:var(--soft);color:var(--ink)}
.btn-ghost:hover{background:rgba(22,28,59,.09)}
.btn-orange{background:var(--orange);color:#fff}
.btn-outline-danger{border:1.5px solid rgba(255,96,0,.4);color:var(--orange-ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-sm{height:36px;padding:0 14px;font-size:14px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.seg button{height:34px;padding:0 14px;border-radius:999px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(22,28,59,.08)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--soft)}
.chip.orange{background:var(--orange);color:#fff}
.chip.mint{background:rgba(150,204,194,.35);color:var(--teal)}
.chip.indigo{background:rgba(79,108,245,.12);color:var(--indigo)}
.chip.warn{background:rgba(255,96,0,.12);color:var(--orange-ink)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,.select{height:46px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 14px;outline:0;width:100%;transition:.15s}
.input:focus,.select:focus{border-color:var(--indigo);box-shadow:0 0 0 4px rgba(79,108,245,.12)}
.input.err{border-color:var(--orange)}
.err-text{font-size:12px;color:var(--orange-ink)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-of-type{border-bottom:0}
.row .lbl{font-weight:500}
.row .lbl small{display:block;color:var(--ink-3);font-weight:400}
.unit-in{display:flex;align-items:center;gap:10px}
.unit-in span{color:var(--ink-3);font-size:13px;white-space:nowrap}
.unit-in .input{width:160px}
.card-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

/* ---------- dashboard ---------- */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:420px;color:#fff;
  background:linear-gradient(100deg,rgba(22,28,59,.88) 0%,rgba(22,28,59,.55) 45%,rgba(22,28,59,.1) 100%),url('https://axiomnovus.com/wp-content/uploads/2023/10/istock-1455358887.jpg') center/cover,var(--navy);
  display:grid;grid-template-columns:1fr 320px;gap:20px;padding:44px 24px 24px 52px}
.hero .eyebrow{color:rgba(255,255,255,.75)}
.hero h1{font-size:64px;font-weight:400;line-height:1.02;letter-spacing:-1.5px;margin-top:18px}
.hero p{font-size:18px;margin-top:16px;color:rgba(255,255,255,.88)}
.hero p b{font-weight:700}
.hero .actions{display:flex;gap:12px;margin-top:40px}
.btn-glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(8px)}
.hero-panel{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-radius:26px;color:var(--ink);padding:22px;align-self:stretch;display:flex;flex-direction:column;gap:14px}
.big-num{font-size:52px;font-weight:300;letter-spacing:-1.5px;line-height:1}
.big-num small{font-size:16px;font-weight:500;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.bar{height:6px;border-radius:999px;background:rgba(22,28,59,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:999px}
.mini{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.mini .v{font-size:28px;font-weight:300}
.mini .d{color:var(--teal);font-size:13px;font-weight:600}
.health{display:flex;gap:6px}
.health span{flex:1;text-align:center;border-radius:999px;padding:8px 0;font-size:13px;font-weight:600;background:var(--soft)}
.health span.on{background:var(--navy);color:#fff}

.attn{background:linear-gradient(160deg,var(--indigo-2),var(--indigo) 60%,#4560E8);color:#fff;border-radius:var(--r-xl);padding:26px;box-shadow:0 24px 60px rgba(79,108,245,.3)}
.attn .card-h .ic{background:rgba(255,255,255,.18);color:#fff}
.attn .card-h small{color:rgba(255,255,255,.8)}
.attn .count{font-size:64px;font-weight:200;line-height:.9}
.attn .count small{font-size:14px;font-weight:500}
.attn .seg{background:rgba(22,28,59,.18)}
.attn .seg button{color:rgba(255,255,255,.85)}
.attn .seg button.on{background:#fff;color:var(--navy)}
.attn-row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.12);border-radius:18px;padding:12px 14px;margin-top:10px;border-left:3px solid transparent}
.attn-row.urgent{border-left-color:var(--orange)}
.attn-row .ai{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.attn-row.urgent .ai{background:var(--orange)}
.attn-row b{display:block;font-weight:600}
.attn-row small{color:rgba(255,255,255,.75)}
.attn-row .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.attn .section{margin-top:18px;font-size:12px;letter-spacing:.12em;font-weight:600;color:rgba(255,255,255,.75)}
.attn-row.done{opacity:.45}
.attn-row.done b{text-decoration:line-through}

.dark-card{background:var(--navy);color:#fff;border-radius:22px;padding:18px}
.dark-card small{color:rgba(255,255,255,.7)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--soft);border-radius:18px;padding:14px}
.kpi .v{font-size:26px;font-weight:600}
.kpi .l{font-size:13px;color:var(--ink-3)}
.kpi .v.pos{color:var(--teal)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chart svg{width:100%;height:auto;display:block}
.chart .tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:6px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-120%)}
.lock-timer{display:flex;gap:8px;align-items:flex-end}
.lock-timer .d{background:var(--navy);color:#fff;border-radius:12px;width:44px;height:52px;display:grid;place-items:center;font-size:24px;font-weight:600}
.lock-timer .lab{font-size:11px;color:var(--ink-3);text-align:center;margin-top:4px}
.range{width:100%;accent-color:var(--indigo)}
.weather-now{display:flex;align-items:center;gap:16px;background:linear-gradient(140deg,var(--navy),#2A3570);color:#fff;border-radius:22px;padding:18px}
.weather-now .t{font-size:46px;font-weight:300}
.hours{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.hours div{flex:none;width:62px;text-align:center;border-radius:16px;padding:10px 0;background:var(--soft);font-size:13px}
.hours div.now{background:var(--indigo);color:#fff}
.hours div b{display:block;font-size:16px;margin:4px 0}
.map{border:0;width:100%;height:240px;border-radius:20px;display:block}
.cmd{display:flex;gap:12px;align-items:flex-start}
.cmd .ic{width:40px;height:40px;border-radius:12px;background:rgba(150,204,194,.35);color:var(--teal);display:grid;place-items:center;flex:none}

/* ---------- plants ---------- */
.plants{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.plist{position:sticky;top:96px}
.plist .item{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;font-weight:600;cursor:pointer}
.plist .item:hover{background:var(--soft)}
.plist .item.active{background:var(--navy);color:#fff}
.plist .item .ic{width:36px;height:36px;border-radius:12px;background:rgba(150,204,194,.35);color:var(--teal);display:grid;place-items:center}
.plist .item.active .ic{background:rgba(255,255,255,.14);color:#fff}
.plist .sub{padding:4px 0 6px 58px;font-size:13px;color:var(--ink-3)}
.plist .sub div{padding:4px 0}
.phead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.phead h2{font-size:30px;font-weight:500}
.phead .star{color:var(--ink-3)}
.phead .star.on{color:var(--orange)}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:#fff;border-radius:999px;padding:6px;box-shadow:var(--shadow);width:fit-content}
.tabs button{height:42px;padding:0 24px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.tabs button.on{background:var(--navy);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.status.bad{background:rgba(255,96,0,.12);color:var(--orange-ink)}
.status.ok{background:rgba(150,204,194,.35);color:var(--teal)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--soft);border-radius:14px;margin-top:8px}
.list-row .x{margin-left:auto;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:14px;padding:12px 0}

/* ---------- wizard ---------- */
.wizard{display:grid;grid-template-columns:300px 1fr;background:#fff;border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;min-height:640px}
.wsteps{background:var(--navy);color:#fff;padding:28px 22px;position:relative;overflow:hidden}
.wsteps::after{content:'';position:absolute;inset:auto -60px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(79,108,245,.45),transparent 70%)}
.wsteps h3{font-size:18px;font-weight:600;margin-bottom:22px}
.wstep{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;color:rgba(255,255,255,.55);font-weight:500;position:relative}
.wstep .n{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:13px;flex:none}
.wstep.done{color:rgba(255,255,255,.85)}
.wstep.done .n{background:var(--mint);border-color:var(--mint);color:var(--navy)}
.wstep.cur{background:rgba(255,255,255,.1);color:#fff}
.wstep.cur .n{border-color:var(--orange);background:var(--orange)}
.wbody{padding:36px 40px;display:flex;flex-direction:column}
.wbody h2{font-size:28px;font-weight:500}
.wbody .sub{color:var(--ink-2);margin-top:6px;margin-bottom:26px}
.wcontent{flex:1}
.wfoot{display:flex;justify-content:space-between;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.choice{border:1.5px solid var(--line);border-radius:22px;padding:20px;text-align:left;transition:.15s;background:#fff}
.choice:hover{border-color:rgba(79,108,245,.4);transform:translateY(-1px)}
.choice.sel{border-color:var(--indigo);background:rgba(79,108,245,.05);box-shadow:0 0 0 4px rgba(79,108,245,.1)}
.choice .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:14px;color:#fff;background:var(--navy)}
.choice img.ic{object-fit:contain;background:var(--soft);padding:8px}
.choice b{display:block;font-size:17px;font-weight:600}
.choice span{display:block;color:var(--ink-2);font-size:14px;margin-top:6px;line-height:1.45}
.mfr{text-align:center}
.mfr .logo-box{height:70px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px;font-weight:800;letter-spacing:.5px;margin-bottom:10px}
.loc{display:grid;grid-template-columns:1fr 300px;gap:20px}
.results{border:1.5px solid var(--line);border-radius:20px;padding:14px;min-height:240px}
.sugg{position:absolute;left:0;right:0;top:50px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(22,28,59,.15);z-index:5;overflow:hidden}
.sugg div{padding:10px 14px;cursor:pointer}
.sugg div:hover{background:var(--soft)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--ink-3)}
.batt-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:12px;align-items:end;margin-top:10px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(22,28,59,.4);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:var(--r-xl);width:min(520px,100%);padding:28px;box-shadow:0 40px 100px rgba(22,28,59,.3);max-height:90vh;overflow:auto}
.modal h3{font-size:22px;font-weight:600;margin-bottom:18px;display:flex;align-items:center}
.modal h3 button{margin-left:auto;color:var(--ink-3)}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.plan{border:1.5px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}
.plan .price{font-size:40px;font-weight:700;margin:6px 0 12px}
.plan .price small{font-size:14px;color:var(--ink-3);font-weight:500}
.plan li{list-style:none;display:flex;gap:8px;align-items:center;padding:5px 0;color:var(--ink-2);font-size:14px}
.or{text-align:center;color:var(--ink-3);font-size:12px;margin:16px 0 0;letter-spacing:.1em}

function seedOf(p, date){ return (p ? p.id : 1) * 97 + date.split('-').reduce((a,b)=>a*31+ +b, 7); }

    const buy = spot + tariff + taxes + (p?p.costs.extraPurchase:0.058);

    return {h, spot, tariff, taxes, buy, sell};

  pr.forEach(x=>{

    const load = 0.6 + (x.h>=17&&x.h<=21?1.4:0) + (x.h>=7&&x.h<=9?0.7:0) + r()*0.3;

function planChart(p){
  const d = plan(p, S.date); const W=720, H=260, L=40, R=40, T=16, B=30; const X = h => L + h*(W-L-R)/24, bw=(W-L-R)/24-6;
  const mid = T + (H-T-B)/2, sc = (H-T-B)/2/4; const Ys = v => T + (1-v/100)*(H-T-B);
  const soc = d.map((x,i)=>`${i?'L':'M'}${X(x.h)+bw/2+3} ${Ys(x.soc)}`).join('');
  const pv = d.map((x,i)=>`${i?'L':'M'}${X(x.h)+bw/2+3} ${mid - Math.min(4,x.pv)*sc}`).join('');
  return `<div class="chart" style="position:relative"><svg viewBox="0 0 ${W} ${H}" data-chart="plan">
    <line x1="${L}" x2="${W-R}" y1="${mid}" y2="${mid}" stroke="rgba(22,28,59,.15)"/>
    ${[-4,-2,2,4].map(v=>`<line x1="${L}" x2="${W-R}" y1="${mid-v*sc}" y2="${mid-v*sc}" stroke="rgba(22,28,59,.06)"/><text x="${L-8}" y="${mid-v*sc+4}" font-size="11" text-anchor="end" fill="rgba(22,28,59,.45)">${v}</text>`).join('')}
    <text x="${L-8}" y="${mid+4}" font-size="11" text-anchor="end" fill="rgba(22,28,59,.45)">0 kW</text>
    ${[0,25,50,75,100].map(v=>`<text x="${W-R+8}" y="${Ys(v)+4}" font-size="11" fill="rgba(47,107,96,.8)">${v}%</text>`).join('')}
    ${d.map(x=>{ const h=Math.abs(x.kw)*sc; const y = x.kw>=0 ? mid-h : mid; const c = x.act==='charge' ? '#4F6CF5' : x.act==='discharge' ? '#FF6000' : 'rgba(22,28,59,.12)';
      return `<rect x="${X(x.h)+3}" y="${y}" width="${bw}" height="${Math.max(2,h)}" rx="4" fill="${c}"/>`; }).join('')}
    <path d="${pv}" fill="none" stroke="#F5B400" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${soc}" fill="none" stroke="#2F6B60" stroke-width="2.4"/>
    ${[0,3,6,9,12,15,18,21].map(h=>`<text x="${X(h)+bw/2+3}" y="${H-8}" font-size="11" text-anchor="middle" fill="rgba(22,28,59,.45)">${String(h).padStart(2,'0')}:00</text>`).join('')}
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" class="hover"/>
  </svg><div class="tip hidden"></div></div>
  <div class="legend" style="margin-top:8px"><span><i style="background:#4F6CF5"></i>Charge</span><span><i style="background:#FF6000"></i>Discharge</span><span><i style="background:#2F6B60"></i>Battery SoC</span><span><i style="background:#F5B400"></i>Solar forecast</span></div>`;
}
function bindChartHover(){
  $$('svg[data-chart]').forEach(svg=>{
    const wrap = svg.parentElement, tip = $('.tip', wrap), kind = svg.dataset.chart, p = plant();
    const data = kind==='price' ? prices(p,S.date) : plan(p,S.date);
    const hover = $('.hover', svg);
    hover.addEventListener('mousemove', e=>{
      const bb = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal; const x = (e.clientX-bb.left)/bb.width*vb.width;
      const L = kind==='price'?44:40, R = kind==='price'?12:40; const h = Math.max(0, Math.min(23, Math.floor((x-L)/((vb.width-L-R)/24))));
      const r = data[h];
      tip.innerHTML = kind==='price'
        ? `<b>${String(h).padStart(2,'0')}:00</b> · buy ${fmt(r.buy,3)} · sell ${fmt(r.sell,3)} · spot ${fmt(r.spot,3)}`
        : `<b>${String(h).padStart(2,'0')}:00</b> · ${r.act} ${fmt(Math.abs(r.kw),1)} kW · SoC ${Math.round(r.soc)}% · PV ${fmt(r.pv,1)} kW`;
      tip.classList.remove('hidden'); tip.style.left = (e.clientX-bb.left)+'px'; tip.style.top = (e.clientY-bb.top)+'px';
    });
    hover.addEventListener('mouseleave', ()=>tip.classList.add('hidden'));
  });
}

/* ---------- toast / modal ---------- */
function toast(msg){ const t = document.createElement('div'); t.className='toast'; t.innerHTML=`<span class="ok">${ic('check',14)}</span>${esc(msg)}`; $('#toasts').appendChild(t); setTimeout(()=>t.remove(), 3200); }
function modal(html, onMount){ const o = document.createElement('div'); o.className='overlay'; o.innerHTML=`<div class="modal">${html}</div>`;
  o.addEventListener('click', e=>{ if (e.target===o || e.target.closest('[data-close]')) o.remove(); }); document.body.appendChild(o); onMount && onMount(o); return o; }

/* ---------- router ---------- */
const routes = {dashboard:renderDashboard, plants:renderPlants, add:renderWizard, support:renderSupport, account:renderAccount};
function go(h){ location.hash = h; }
function route(){
  if (!S.authed) return renderLogin();
  const [r, a, b] = location.hash.replace(/^#\/?/,'').split('/');

}

function renderEV(){

    <div style="display:flex;gap:14px;align-items:flex-end;justify-content:center"><div><div class="lock-timer">${dg(hh)}</div><div class="lab">hrs</div></div><div><div class="lock-timer">${dg(mm)}</div><div class="lab">mins</div></div><div><div class="lock-timer">${dg(ss)}</div><div class="lab">secs</div></div></div>

  $$('[data-ev]').forEach(b=>b.onclick=()=>{ S.ev.mode=b.dataset.ev; renderEV(); });
  $('#evH').oninput = e => { S.ev.hours=+e.target.value; $('#evCard p b').textContent = S.ev.hours+' h'; };
  $('#evH').onchange = () => renderEV();
  if ($('#evLock')) $('#evLock').onclick = () => { if (S.ev.mode==='now'){ S.ev.until = Date.now()+S.ev.hours*36e5; toast(`Battery locked for ${S.ev.hours} h`); } else { toast(`EV lock scheduled at ${$('#evAt').value} for ${S.ev.hours} h`); } renderEV(); };

function bindWizard(k, steps){
  const d = W.d, wp = W.plantId && getPlant(W.plantId);
  $$('[data-pick]').forEach(b=>b.onclick=()=>{ const f=b.dataset.pick; if (f==='mfr' && d.mfr!==b.dataset.v){ d.model=''; d.serial=''; d.batteries=[]; } d[f]=b.dataset.v; W.err=''; renderWizard(); });
  const on = (id, ev, fn) => { const el = $(id); if (el) el[ev] = fn; };
  on('#wName','oninput', e=>d.name=e.target.value);
  on('#wQ','oninput', e=>{ d.q=e.target.value; const v=d.q.toLowerCase().trim(); const s=$('#wSug'); const hits = v?CITIES.filter(c=>c.label.toLowerCase().includes(v)):[];
    s.innerHTML = hits.map((c,i)=>`<div data-city="${CITIES.indexOf(c)}">${ic('pin',14)} ${esc(c.label)}</div>`).join('') || (v?'<div class="muted">No match in demo geocoder</div>':''); s.classList.toggle('hidden', !v);
    $$('[data-city]',s).forEach(x=>x.onclick=()=>{ d.loc=clone(CITIES[+x.dataset.city]); d.q=d.loc.label; W.err=''; renderWizard(); }); });
  on('#wStreet','oninput', e=>d.loc.street=e.target.value);
  on('#wLink','onclick', ()=>connectCloud(wp, renderWizard));
  on('#wModel','onchange', e=>d.model=e.target.value);
  on('#wSerial','oninput', e=>{ d.serial=e.target.value.trim(); e.target.nextElementSibling.textContent = d.serial.length+'/14'; });
  on('#wBattAdd','onclick', ()=>{ d.batteries.push({mfr:d.mfr, model:MFR[d.mfr].batt[0]}); renderWizard(); });
  $$('[data-bm]').forEach(s=>s.onchange=()=>{ const b=d.batteries[+s.dataset.bm]; b.mfr=s.value; b.model=MFR[s.value].batt[0]; renderWizard(); });
  $$('[data-bmo]').forEach(s=>s.onchange=()=>d.batteries[+s.dataset.bmo].model=s.value);
  $$('[data-bdel]').forEach(b=>b.onclick=()=>{ d.batteries.splice(+b.dataset.bdel,1); renderWizard(); });
  on('#wEv','onclick', ()=>{ d.ev.has=!d.ev.has; renderWizard(); });
  on('#wEvB','onchange', e=>d.ev.brand=e.target.value); on('#wEvP','onchange', e=>d.ev.power=+e.target.value);
  on('#wKey','oninput', e=>d.key=e.target.value.toUpperCase());
  on('#wKeyDemo','onclick', ()=>{ d.key=makeKey(); renderWizard(); });
  on('#wSub','onclick', ()=>{ d.key=makeKey(); d.sub=true; toast('Subscribed – key filled in'); renderWizard(); });
  on('#wDone','onclick', ()=>{ W=null; go('#/dashboard'); });
  $('#wBack').onclick = () => { W.err=''; if (W.transfer){ W.transfer=false; return renderWizard(); } if (W.i===0){ W=null; return go('#/dashboard'); } W.i--; renderWizard(); };
  on('#wNext','onclick', ()=>{
    const fail = m => { W.err=m; renderWizard(); };
    if (k==='setup'){ if (!d.setup) return fail('Please choose an option.'); if (d.setup==='transfer'){ W.transfer=true; return renderWizard(); } }
    if (k==='product' && !d.product) return fail('Please choose a product.');
    if (k==='type' && !d.type) return fail('Please choose a system type.');
    if (k==='name' && !d.name.trim()) return fail('Plant name is required.');
    if (k==='location' && !d.loc) return fail('Please search and select a location.');
    if (k==='manufacturer'){ if (!d.mfr) return fail('Please select a manufacturer.'); saveWizardPlant(); }
    if (k==='inverter'){ if (!d.model) return fail('Please select an inverter model.'); if (d.serial.length!==14) return fail("The inverter's serial number must be 14 characters long."); }
    if (k==='key' && d.key && !KEY_RE.test(d.key)) return fail('Key must look like XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX');
    W.err='';
    if (W.i === steps.length-1){ finishWizard(); return; }
    W.i++; renderWizard();
  });
}
function saveWizardPlant(){
  const d = W.d; let p = W.plantId && getPlant(W.plantId);
  if (!p){ p = {id: Math.max(6300,...S.plants.map(x=>x.id))+1, fav:false, created:new Date().toISOString().slice(0,10), linked:false, key:null, plan:null, inverters:[], installers:[], ev:{has:false}, costs:defaultCosts(), settings:defaultSettings()}; S.plants.push(p); W.plantId=p.id; toast('Plant created successfully'); }
  if (p.mfr && p.mfr!==d.mfr) p.linked=false;
  Object.assign(p, {name:d.name.trim(), product:d.product||'charge', type:d.type||'home', loc:clone(d.loc), mfr:d.mfr}); p.costs.area = d.loc.area!=='—'?d.loc.area:p.costs.area;
}
function finishWizard(){
  const d = W.d, p = getPlant(W.plantId);
  p.inverters = [{serial:d.serial.toUpperCase(), model:d.model, mfr:d.mfr, batteries:clone(d.batteries)}];
  p.ev = d.ev.has ? clone(d.ev) : {has:false};
  if (d.key){ p.key=d.key; p.plan = d.sub ? 'SmartCharge DK Annual' : 'Installer key'; }
  S.plantId = p.id; W = null; toast(`${p.name} is ready`); go(`#/plants/${p.id}/plant`);
}

/* ---------- support ---------- */
function renderSupport(){
  const cards = [['mail','Email us','info@axiomnovus.com','Typical reply within one working day',false],['phone','Call us','+45 00 00 00 00','Check phone hours on axiomnovus.com',false],['chat','Chat now','Talk to an energy advisor','Online now',true],
    ['card','Change subscription','SmartCharge DK Annual','Upgrade, downgrade or cancel',false],['book','Guides','Set-up and inverter guides','Huawei, SolaX, Fronius and more',false],['help','FAQ','Common questions','Savings, AI plans, EV lock',false]];
  $('#main').innerHTML = `<div class="page"><section class="hero" style="min-height:240px;grid-template-columns:1fr;background:linear-gradient(100deg,rgba(22,28,59,.9),rgba(22,28,59,.35)),url('https://axiomnovus.com/wp-content/uploads/2023/08/istock-1206142686-scaled.jpg') center/cover,var(--navy)">
    <div><div class="eyebrow">Support</div><h1 style="font-size:48px">How can we help?</h1><p>Axiom Novus engineers support you from design to daily operation.</p></div></section>
    <div class="supp">${cards.map(([i,t,s,n,f],x)=>`<div class="card ${f?'feature':''}" data-sup="${x}"><div class="ic">${ic(i,24)}</div><b style="font-size:18px">${t}</b><div>${esc(s)}</div><small>${esc(n)}</small></div>`).join('')}</div></div>`;
  $$('[data-sup]').forEach(c=>c.onclick=()=>toast(`Demo: “${cards[+c.dataset.sup][1]}” would open here`));
}

/* ---------- account ---------- */
function renderAccount(){
  const u = S.user;
  $('#main').innerHTML = `<div class="page"><div class="phead"><h2>Account</h2><div class="acts"><button class="btn btn-outline-danger btn-sm" id="delAcc">${ic('trash',16)} Delete account</button></div></div>
    <section class="card" data-card="Profile"><div class="card-h"><div class="ic">${ic('user')}</div><div><h3>Profile</h3><small>Used for reports and notifications</small></div></div>
      <div class="form-grid"><div class="field"><label>First name</label><input class="input" data-k="first" data-t="str" data-req="1" value="${esc(u.first)}"></div><div class="field"><label>Last name</label><input class="input" data-k="last" data-t="str" data-req="1" value="${esc(u.last)}"></div>
        <div class="field"><label>Email</label><input class="input" data-k="email" data-t="str" value="${esc(u.email)}"></div>
        <div class="field"><label>Phone number</label><div style="display:flex;gap:8px"><select class="select" style="width:110px" data-k="phoneCode" data-t="str">${['+45','+49','+46','+47','+92','+44'].map(c=>`<option ${c===u.phoneCode?'selected':''}>${c}</option>`).join('')}</select><input class="input" data-k="phone" data-t="str" value="${esc(u.phone)}"></div></div>
        <div class="field"><label>Preferred language</label>${sel('lang',['English','Dansk','Deutsch','Svenska'],u.lang)}</div><div class="field"><label>Send savings report</label>${sel('report',['Weekly','Monthly','Quarterly','Never'],u.report)}</div></div>${foot()}</section>
    <section class="card"><div class="card-h"><div class="ic">${ic('card')}</div><div><h3>Subscription plans</h3><small>${S.plants.filter(p=>p.key).length} of ${S.plants.length} plants have AI management</small></div></div>
      ${S.plants.map(p=>`<div class="list-row">${ic(p.type==='ci'?'factory':'home',18)}<div><b>${esc(p.name)}</b><div class="muted" style="font-size:13px">${p.key?esc(p.plan):'No product key'}</div></div><span style="margin-left:auto">${p.key?'<span class="status ok">Active</span>':`<button class="btn btn-orange btn-sm" data-subp="${p.id}">Subscribe ${ic('right',14)}</button>`}</span></div>`).join('')}</section></div>`;
  bindCards(S.user, route);
  $$('[data-subp]').forEach(b=>b.onclick=()=>openKeyModal(getPlant(b.dataset.subp), renderAccount));
  $('#delAcc').onclick = () => { const o = modal(`<h3>Delete account<button data-close>${ic('x')}</button></h3><p class="muted">This would delete your account and all ${S.plants.length} plants. In this demo nothing is deleted.</p><div class="foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-orange" id="ok">I understand</button></div>`); $('#ok',o).onclick=()=>{ o.remove(); toast('Demo: account deletion requested'); }; };
}

/* ---------- boot ---------- */
route();
</script></body></html>
